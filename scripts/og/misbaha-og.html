<!doctype html>
<!--
  Link-preview images (1200×630) for the sebha pages: public/og/misbaha.jpg and misbaha-sick.jpg.
  Rendered with headless Chrome by scripts/og/render-misbaha-og.sh — open with ?v=main or ?v=sick.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "DIN"; src: url("../../public/fonts/DINNextLTArabic-Bold.ttf"); font-weight: 700 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "DIN", sans-serif; color: #fff; position: relative;
    background: radial-gradient(ellipse 70% 90% at 22% 50%, #1d5a2c 0%, #0d3f22 55%, #06301c 100%);
  }
  .ring { position: absolute; left: 70px; top: 105px; width: 420px; height: 420px; }
  .center { position: absolute; left: 190px; top: 225px; width: 180px; height: 180px; display: grid; place-items: center; }
  .center img { width: 160px; height: 160px; border-radius: 50%; }
  .text { position: absolute; right: 72px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { color: #a3e635; font-size: 27px; font-weight: 800; }
  h1 { margin-top: 14px; font-size: 76px; line-height: 1.15; font-weight: 900; }
  p { margin-top: 18px; font-size: 30px; line-height: 1.6; color: rgba(255,255,255,0.9); }
  .foot { position: absolute; right: 72px; bottom: 36px; display: flex; align-items: center; gap: 14px; direction: ltr; }
  .foot b { font-family: system-ui, sans-serif; font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.9); }
  .foot img { width: 54px; height: 54px; border-radius: 50%; }
</style>
</head>
<body>
  <svg class="ring" viewBox="0 0 420 420" id="ring"></svg>
  <div class="center" id="center"></div>
  <div class="text">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p id="line"></p>
  </div>
  <div class="foot"><img src="../../public/icons/icon-192.png" alt="" /><b>elyusr.org</b></div>

<script>
  const V = new URLSearchParams(location.search).get("v") || "main";
  const C = {
    main: {
      kicker: "مؤسسة اليسر الخيرية",
      title: "السبحة الإلكترونية",
      line: "صلِّ على النبي ﷺ، وسبّح، واستغفر — واعمل سبحة مشتركة لحد غالي عليك",
    },
    sick: {
      kicker: "سبحة مشتركة · بنية الشفاء",
      title: "ادعُ معانا بالشفاء",
      line: "اللهم ربّ الناس أذهب البأس، اشفِ أنت الشافي، شفاءً لا يغادر سقمًا",
    },
  }[V];
  document.getElementById("kicker").textContent = C.kicker;
  document.getElementById("title").textContent = C.title;
  document.getElementById("line").textContent = C.line;

  // 33 beads, the three «marker» beads brighter (same look as the site's sebha).
  const ring = document.getElementById("ring");
  let beads = "";
  for (let i = 0; i < 33; i++) {
    const a = (-90 + (i * 360) / 33) * (Math.PI / 180);
    const x = 210 + 170 * Math.cos(a), y = 210 + 170 * Math.sin(a);
    const mark = i % 11 === 0;
    beads += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${mark ? 12 : 10.5}" fill="${mark ? "#a3e635" : "rgba(163,230,53,0.55)"}"/>`;
  }
  ring.innerHTML = beads;

  const center = document.getElementById("center");
  if (V === "sick") {
    // A heart with a medical cross and a pulse line: «for healing».
    center.innerHTML = `
      <svg viewBox="0 0 200 200" width="200" height="200">
        <defs>
          <linearGradient id="h" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/>
          </linearGradient>
          <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
        </defs>
        <circle cx="100" cy="100" r="92" fill="rgba(255,255,255,0.06)" stroke="rgba(163,230,53,0.35)" stroke-width="2"/>
        <path filter="url(#s)" fill="url(#h)" d="M100 168 C 58 138, 26 112, 26 78 C 26 54, 44 36, 67 36 C 82 36, 94 44, 100 56 C 106 44, 118 36, 133 36 C 156 36, 174 54, 174 78 C 174 112, 142 138, 100 168 Z"/>
        <rect x="88" y="62" width="24" height="70" rx="5" fill="#fff"/>
        <rect x="65" y="85" width="70" height="24" rx="5" fill="#fff"/>
        <polyline points="18,150 62,150 74,132 86,166 98,142 106,150 182,150" fill="none" stroke="#a3e635" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
      </svg>`;
  } else {
    center.innerHTML = `<img src="../../public/icons/icon-512.png" alt="" />`;
  }
</script>
</body>
</html>
